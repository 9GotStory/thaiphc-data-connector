name: Node.js 24 offline checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runtime
        run: node --version
      - name: Run offline schema tests
        run: npm test
