name: Node.js 26 offline checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify runtime
        run: node --version
      - name: Run offline schema tests
        run: npm test
