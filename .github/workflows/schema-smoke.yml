name: Node.js 26 offline checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Verify runtime
        run: node --version && npm --version
      - name: Run legacy offline tests (zero dependencies)
        run: npm test
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck frontend and backend
        run: npm run typecheck
      - name: Lint frontend and backend
        run: npm run lint
      - name: Check Prettier formatting
        run: npm run format:check
      - name: Build single-file frontend and GAS backend bundle
        run: npm run build
      - name: Run frontend Vitest suite
        run: npm --workspace=frontend run test
      - name: Run backend Vitest and node:vm GAS bundle verification
        run: npm --workspace=backend run test
